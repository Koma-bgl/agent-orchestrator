services:
  ao:
    build:
      context: .
      dockerfile: Dockerfile
    # @aoagents/ao is linux-x64 only; emulated on arm64 dev machines, native on the VM.
    platform: linux/amd64
    image: ao-local:dev
    env_file:
      - .env
    # Defense-in-depth: a tini-equivalent init reaps zombies (agents spawn tmux
    # children later) and forwards signals. The entrypoint already exec's the
    # real Go binary as PID 1, so this is belt-and-suspenders, not load-bearing.
    init: true
    # NOTE: the daemon binds 127.0.0.1 only, so publishing 3001 to the host would
    # NOT reach it (and the deployed stack must never expose 3001 anyway — Caddy
    # is the only public surface). Verify via `docker compose exec`.
    # `expose` makes the socat bridge (:8080) reachable as `ao:8080` on the
    # compose network for Caddy ONLY — it is NOT published to the host.
    expose:
      - "8080"
      - "8090"
    volumes:
      # Durable daemon state (SQLite + running.json) survives restarts/rebuilds.
      - ao-state:/root/.ao
      # For the gcp secret source locally: mount your ADC read-only. Harmless if unused.
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  caddy:
    build:
      context: ./caddy
    image: ao-caddy:dev
    depends_on:
      - ao
    env_file:
      - .env
    environment:
      # Local defaults; M7 overrides these with the real domain + drops tls internal.
      AO_SITE_ADDRESS: ${AO_SITE_ADDRESS:-localhost:8443}
      AO_SITE_URL: ${AO_SITE_URL:-https://localhost:8443}
    # Only Caddy is published. Local: HTTPS on 8443 (Caddy internal cert).
    # M7 switches to "80:80" + "443:443" for the public domain + Let's Encrypt.
    ports:
      - "8443:8443"
    volumes:
      # Our Caddyfile (read-only). Without this, Caddy runs the stock image
      # default (a file-server welcome page) instead of the auth + proxy config.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The static monitoring SPA, served by Caddy at /srv (M6/M7: bake into the
      # image instead of host-mounting so Watchtower updates the UI on pull).
      - ./web:/srv:ro
      - caddy-data:/data      # cert/ACME storage; persists the internal CA locally
      - caddy-config:/config
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    volumes:
      # Required: Watchtower recreates sibling containers via the Docker API.
      # This is root-equivalent on the host — the documented trust boundary.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Watchtower's client defaults to an ancient Docker API (1.25); modern
      # daemons require >= 1.40. Pin a version within the daemon's supported range.
      DOCKER_API_VERSION: "1.44"
      # 6-field cron (sec min hr dom mon dow) = 00:00:00 daily.
      WATCHTOWER_SCHEDULE: "0 0 0 * * *"
      # Only touch containers we labelled; never update Watchtower itself.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Remove the old image after a successful update.
      WATCHTOWER_CLEANUP: "true"
      # On-demand update API (M5 "update now" calls this); keep the schedule too.
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:-changeme-local}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    # API on container :8080 — exposed to the compose network for M5 only,
    # NOT published to the host.
    expose:
      - "8080"

volumes:
  ao-state:
  caddy-data:
  caddy-config:
