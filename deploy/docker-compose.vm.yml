# VM/public-mode override. Apply ON TOP of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.vm.yml up -d --build
#
# Compose merges `ports`/`volumes` lists by APPENDING — so we use the `!override`
# tag to REPLACE them, otherwise the base's 8443 + local Caddyfile mount would
# also apply (publishing 8443 and double-mounting /etc/caddy/Caddyfile).
services:
  ao:
    # Registry image so Watchtower has something to PULL (locally-built images
    # never update). The base `build:` stays as a fallback: bootstrap tries
    # `compose pull` first and only builds when the registry is unreachable —
    # a local build is tagged with this same ref, so Watchtower converges it
    # to the registry image on a later poll.
    image: ${AO_IMAGE:-us-central1-docker.pkg.dev/cloudbet-native/ao-fleet/ao:latest}

  watchtower:
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
      # Registry credentials for the nightly pull. The DIRECTORY is mounted
      # (not config.json itself) because `docker login` replaces the file —
      # a file bind-mount would go stale on the old inode. Credentials are
      # short-lived SA access tokens refreshed by the ao-registry-login.timer
      # systemd unit (installed by bootstrap-gcs.sh).
      - /root/.docker:/dockerconfig:ro
    environment:
      DOCKER_CONFIG: /dockerconfig

  caddy:
    image: ${AO_CADDY_IMAGE:-us-central1-docker.pkg.dev/cloudbet-native/ao-fleet/caddy:latest}
    ports: !override
      - "80:80" # Let's Encrypt HTTP-01 challenge + HTTP→HTTPS redirect
      - "443:443" # public HTTPS
    volumes: !override
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro # public-mode config (auto-TLS)
      - caddy-data:/data # ACME/cert storage (persist!)
      - caddy-config:/config
    environment:
      # The bot's fleet hostname (<user>.binary-badger.xyz), supplied by
      # deploy-gcp.sh create, plus the SSO-portal login URL and the fleet
      # allowlist (space-separated; parse-time splat in Caddyfile.public).
      AO_SITE_ADDRESS: ${AO_SITE_ADDRESS}
      AO_SITE_URL: https://${AO_SITE_ADDRESS}
      AO_AUTH_URL: ${AO_AUTH_URL}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
