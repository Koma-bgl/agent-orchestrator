name: Build Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra tag to push (e.g. a version). Defaults to 'manual'.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMG="ghcr.io/${{ github.repository }}"
          IMG="$(printf '%s' "$IMG" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.event_name }}" = "release" ]; then
            VER="${{ github.event.release.tag_name }}"
            echo "tags=${IMG}:stable,${IMG}:${VER}" >> "$GITHUB_OUTPUT"
          else
            EXTRA="${{ inputs.tag }}"; EXTRA="${EXTRA:-manual}"
            echo "tags=${IMG}:${EXTRA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
