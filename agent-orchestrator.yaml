# Agent Orchestrator — self-hosting config (dog-fooding)

dataDir: ~/.ao-sessions
worktreeDir: ~/.worktrees/ao

defaults:
  runtime: tmux
  agent: claude-code
  workspace: worktree
  notifiers: [desktop]

projects:
  ao:
    name: Agent Orchestrator
    repo: ComposioHQ/agent-orchestrator
    path: ~/agent-orchestrator
    defaultBranch: main
    sessionPrefix: ao
    scm:
      plugin: github
    tracker:
      plugin: linear
      teamId: "2a6e9b1b-19cd-4e30-b5bd-7b34dc491c7e"
    symlinks: [.claude]
    postCreate:
      - "pnpm install"
    agentConfig:
      permissions: skip

    # Reaction handlers — auto-handle routine issues, escalate when needed
    reactions:
      ci-failed:
        auto: true
        action: send-to-agent
        retries: 2
        escalateAfter: 2

      changes-requested:
        auto: true
        action: send-comments-to-agent
        escalateAfter: 30m

      approved-and-green:
        auto: true
        action: auto-merge

      approved-behind:
        auto: true
        action: auto-merge
        escalateAfter: 15m

      agent-stuck:
        threshold: 10m
        action: notify
        priority: urgent
